name: Tests and public-tree boundaries
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_public_tree.py
      - run: ruff check app tests scripts
      - run: pytest -q
        env:
          APP_ENV: test
          TELEGRAM_CHAT_ID: '1'
          CORE_STOCK_SYMBOLS: NVDA,MRVL,SNDK
          EMPLOYMENT_EXCLUDED_STOCK_SYMBOLS: CSCO
