name: Tests and public-tree boundaries
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_public_tree.py
      - name: Scan committed history for secrets
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          printf '%s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
      - run: ruff check app tests scripts
      - run: pytest -q
        env:
          APP_ENV: test
          TELEGRAM_CHAT_ID: '1'
          CORE_STOCK_SYMBOLS: NVDA,MRVL,SNDK
          EMPLOYMENT_EXCLUDED_STOCK_SYMBOLS: CSCO
