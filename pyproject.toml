[project]
name = "finn"
version = "0.1.0"
description = "Telegram-driven market bot for Robinhood-aware stock/ETF and prediction-market recommendations."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "sqlmodel>=0.0.24",
  "sqlalchemy>=2.0.0",
  "httpx>=0.28.0",
  "browser-cookie3>=0.20.1",
  "cryptography>=45.0.0",
  "python-dotenv>=1.1.0",
  "apscheduler>=3.10.4",
  "tenacity>=9.1.0",
  "yfinance>=0.2.54",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff==0.15.12",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
